<!DOCTYPE html>
<html lang="vi">
<head>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>DELTA IPA VN <span class="version">v1.6.0</span></h1>
      <p class="status-bar">
        <span>THIẾT BỊ<br><strong>iPhone18,1</strong></span>

    <!-- Danh sách ứng dụng -->

      <div class="app-card">

            <div class="app-pkg">com.dts.freefiremax</div>

      </div>

      <div class="app-card">
        <div class="app-info">
          <div class="app-icon ff-normal"></div>
          <div>
            <div class="app-name">Free Fire</div>
            <div class="app-pkg">com.dts.freefireth</div>
          </div>
        </div>
        <button class="btn-action">READY &gt;</button>
      </div>
    </div>

    <!-- Cấu hình độ nhạy -->
    <div class="section-title" style="margin-top: 20px;">CẤU HÌNH ĐỘ NHẠY GỢI Ý</div>
    <div class="sens-box">
      <button id="gen-btn" onclick="generateSens()">Tạo Độ Nhạy Chuẩn</button>
      <div id="result-box">Nhấn nút trên để lấy thông số...</div>
    </div>

    <!-- Footer -->
    <div class="footer-note">
      <p>📢 Delta VN Mãi Chất, Em Yêu Delta &lt;3</p>
      <div class="key-status">
        <span>KEY: DELT•••• CAC</span>
        <span class="sub-text">Còn 36499 ngày 23 giờ</span>
