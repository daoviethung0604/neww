<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DVH HUB</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div class="container">
    <!-- Header -->
    <div class="header">
      <h1>DVH <span class="version">v1.6.0</span></h1>
      <p class="status-bar">
        <span>THIẾT BỊ<br><strong id="user-device">Đang quét...</strong></span>
        <span>HỆ ĐIỀU HÀNH<br><strong id="user-os">Đang quét...</strong></span>
        <span>TƯƠNG THÍCH<br><strong class="active">• Có Hỗ Trợ</strong></span>
      </p>
    </div>

    <!-- Danh sách ứng dụng -->
    <div class="section-title">ỨNG DỤNG </div>
    
    <div class="app-list">
      <div class="app-card">
        <div class="app-info">
          <img src="https://ff.garena.com/static/images/icon_ffmax.png" alt="FF Max" class="app-icon" onerror="this.src='https://via.placeholder.com/42/ff4500/ffffff?text=FFM'">
          <div>
            <div class="app-name">Free Fire Max</div>
            <div class="app-pkg">com.dts.freefiremax</div>
          </div>
        </div>
        <button class="btn-action">READY &gt;</button>
      </div>

      <div class="app-card">
        <div class="app-info">
          <img src="https://ff.garena.com/static/images/icon_ff.png" alt="FF" class="app-icon" onerror="this.src='https://via.placeholder.com/42/ff8c00/ffffff?text=FF'">
          <div>
            <div class="app-name">Free Fire</div>
            <div class="app-pkg">com.dts.freefireth</div>
          </div>
        </div>
        <button class="btn-action">READY &gt;</button>
      </div>
    </div>

    <!-- Phần Nhập & Quản Lý Key -->
    <div class="section-title" style="margin-top: 18px;">QUẢN LÝ KEY XÁC THỰC</div>
    <div class="key-box">
      <div class="input-group">
        <input type="text" id="key-input" placeholder="Dán mã Key của bạn vào đây..." value="DVH-8888-9999-VIP">
        <button onclick="checkKey()">KÍCH HOẠT</button>
      </div>
      <div class="key-info">
        <span>TRẠNG THÁI KEY: <strong id="key-status" style="color: #34c759;">ĐÃ XÁC THỰC</strong></span>
        <span class="sub-text">Hạn dùng: <strong id="key-expire">30 ngày 00 giờ</strong></span>
      </div>
    </div>

    <!-- Footer -->
    <div class="footer-note">
      <p>📢 HỆ THỐNG DVH VIP - CHÚC BẠN TRẢI NGHIỆM VUI VẺ &lt;3</p>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
