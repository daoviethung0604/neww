<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>DeltaClient.io - Cổng Dịch Vụ</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" rel="stylesheet">
    <style>
        :root {
            --main-bg: #f4f7fe;
            --card-bg: #ffffff;
            --primary-blue: #3b52d4;
            --text-main: #1e293b;
            --text-sub: #64748b;
            --border-color: #e2e8f0;
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background-color: var(--main-bg); color: var(--text-main); min-height: 100vh; padding-bottom: 70px; }
        
        header {
            height: 60px; background-color: var(--card-bg); border-bottom: 1px solid var(--border-color);
            display: flex; align-items: center; justify-content: space-between; padding: 0 16px;
            position: sticky; top: 0; z-index: 100;
        }
        .logo-text { font-size: 1.2rem; font-weight: 800; color: #0f172a; cursor: pointer; }
        .balance-pill { background-color: #eff6ff; color: #1e40af; padding: 6px 12px; border-radius: 20px; font-size: 0.82rem; font-weight: 700; border: 1px solid #bfdbfe; cursor: pointer; }
        
        .content-container { padding: 16px; max-width: 650px; margin: 0 auto; }
        .section-title { font-size: 1.3rem; font-weight: 800; margin-bottom: 15px; }

        /* HERO */
        .hero-card {
            background: linear-gradient(180deg, #eff6ff 0%, #f8fafc 100%);
            border: 1px solid #e0f2fe; border-radius: 20px; padding: 24px 20px; margin-bottom: 15px;
        }
        .hero-card h1 { font-size: 1.5rem; font-weight: 800; color: #0f172a; margin-bottom: 10px; }
        .hero-card p { color: var(--text-sub); font-size: 0.9rem; margin-bottom: 20px; }
        
        .btn-action {
            width: 100%; padding: 12px 20px; border-radius: 25px; font-weight: 700; font-size: 0.95rem;
            display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; border: none;
        }
        .btn-primary { background-color: var(--primary-blue); color: #ffffff; box-shadow: 0 4px 12px rgba(59, 82, 212, 0.25); }

        /* ĐƠN HÀNG */
        .order-list { display: flex; flex-direction: column; gap: 12px; }
        .order-card { background: white; border: 1px solid var(--border-color); border-radius: 14px; padding: 16px; }
        .order-header { display: flex; justify-content: space-between; font-weight: 700; margin-bottom: 8px; font-size: 0.95rem; align-items: center; }
        .order-status { padding: 2px 8px; border-radius: 6px; font-size: 0.75rem; font-weight: 700; }
        .status-success { color: #166534; background: #dcfce7; }
        .status-pending { color: #854d0e; background: #fef9c3; }
        
        /* BOTTOM NAVBAR */
        .bottom-nav { position: fixed; bottom: 0; left: 0; right: 0; height: 60px; background-color: #ffffff; border-top: 1px solid var(--border-color); display: flex; justify-content: space-around; align-items: center; z-index: 1000; }
        .nav-item { display: flex; flex-direction: column; align-items: center; color: var(--text-sub); font-size: 0.7rem; font-weight: 600; text-decoration: none; gap: 4px; cursor: pointer; }
        .nav-item i { font-size: 1.1rem; }
        .nav-item.active { color: var(--primary-blue); }

        /* MODAL */
        .modal-overlay { position: fixed; top: 0; left: 0; right: 0; bottom: 0; background: rgba(15, 23, 42, 0.6); display: none; justify-content: center; align-items: center; z-index: 2000; }
        .modal-card { background: #ffffff; width: 90%; max-width: 380px; padding: 25px; border-radius: 20px; position: relative; text-align: center; }
        .close-modal { position: absolute; top: 15px; right: 15px; background: none; border: none; font-size: 1.2rem; cursor: pointer; color: var(--text-sub); }
        .qr-box { background: #f8fafc; border: 1px dashed var(--border-color); padding: 15px; border-radius: 12px; margin: 15px 0; }
        .qr-box img { width: 180px; height: 180px; object-fit: contain; margin-bottom: 8px; }
        .input-deposit { width: 100%; padding: 10px; border: 1px solid var(--border-color); border-radius: 8px; margin-bottom: 12px; font-size: 0.95rem; outline: none; text-align: center; font-weight: 700; color: var(--primary-blue); }
        .page-view { display: none; }
        .page-view.active { display: block; }
    </style>
</head>
<body>

    <header>
        <span class="logo-text" onclick="switchTab('home')">DeltaClient.io</span>
        <div class="balance-pill" onclick="openDepositModal()">Ví: <span id="userBalance">0đ</span></div>
    </header>

    <div class="content-container">
        <!-- TRANG CHỦ -->
        <div id="view-home" class="page-view active">
            <div class="hero-card">
                <h1>Hệ thống Proxy & Dịch Vụ DeltaClient</h1>
                <p>Nạp tiền tự động qua QR, hệ thống duyệt đơn siêu tốc qua Telegram Bot.</p>
                <button class="btn-action btn-primary" onclick="openDepositModal()"><i class="fa-regular fa-credit-card"></i> Nạp tiền ngay</button>
            </div>
        </div>

        <!-- TRANG ĐƠN HÀNG -->
        <div id="view-orders" class="page-view">
            <div class="section-title">Lịch Sử Giao Dịch</div>
            <div class="order-list" id="orderContainer"></div>
        </div>
    </div>

    <!-- BOTTOM NAVBAR -->
    <nav class="bottom-nav">
        <div class="nav-item active" id="nav-home" onclick="switchTab('home')"><i class="fa-solid fa-house"></i><span>Trang chủ</span></div>
        <div class="nav-item" id="nav-orders" onclick="switchTab('orders')"><i class="fa-solid fa-receipt"></i><span>Đơn hàng</span></div>
        <div class="nav-item" onclick="handleAuth()"><i class="fa-regular fa-user"></i><span id="authText">Đăng nhập</span></div>
    </nav>

    <!-- MODAL NẠP TIỀN -->
    <div class="modal-overlay" id="depositModal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeModal('depositModal')"><i class="fa-solid fa-xmark"></i></button>
            <h2>Nạp Tiền Qua QR</h2>
            <div class="qr-box">
                <img src="https://img.vietqr.io/image/MB-0348876411-compact2.png" alt="QR">
                <div style="font-size: 0.8rem; font-weight: 800;">DAO VIET HUNG - 0348876411</div>
            </div>
            <input type="text" id="depositAmountInput" class="input-deposit" value="50.000" oninput="formatMoney(this)">
            <button class="btn-action btn-primary" id="btnConfirmDeposit">Xác Nhận Đã Chuyển Khoản</button>
        </div>
    </div>

    <!-- MODAL ĐĂNG NHẬP -->
    <div class="modal-overlay" id="loginModal">
        <div class="modal-card">
            <button class="close-modal" onclick="closeModal('loginModal')"><i class="fa-solid fa-xmark"></i></button>
            <h2>Đăng Nhập</h2>
            <p style="color: var(--text-sub); font-size: 0.85rem; margin: 10px 0;">Đăng nhập bằng tài khoản Google để sử dụng ví</p>
            <button class="btn-action btn-primary" id="googleLoginBtn"><i class="fa-brands fa-google"></i> Đăng nhập với Google</button>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getAuth, signInWithPopup, GoogleAuthProvider, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const firebaseConfig = {
            apiKey: "AIzaSyB2uSm-06dZe9Lj2tXXpOy1kU2oKWN2GHw",
            authDomain: "delta-client-ce1cc.firebaseapp.com",
            projectId: "delta-client-ce1cc",
            storageBucket: "delta-client-ce1cc.appspot.com",
            messagingSenderId: "308243265700",
            appId: "1:308243265700:web:b4a697b39e5e18cffe8e31"
        };

        const app = initializeApp(firebaseConfig);
        const auth = getAuth(app);
        const db = getFirestore(app);
        const provider = new GoogleAuthProvider();

        let currentUser = null;
        const TOKEN = "8731371048:AAHqRh4twWEVbGWd_NVyxcSmsR8uu7gDzj8";
        const CHAT_ID = "8697704932";

        window.formatMoney = (input) => {
            let val = input.value.replace(/\D/g, '');
            input.value = val ? Number(val).toLocaleString('vi-VN') : '';
        };

        window.switchTab = (tab) => {
            document.querySelectorAll('.page-view').forEach(v => v.classList.remove('active'));
            document.querySelectorAll('.nav-item').forEach(i => i.classList.remove('active'));
            document.getElementById(`view-${tab}`).classList.add('active');
            if(document.getElementById(`nav-${tab}`)) document.getElementById(`nav-${tab}`).classList.add('active');
            if(tab === 'orders') loadOrders();
        };

        window.openDepositModal = () => {
            if(!currentUser) { document.getElementById('loginModal').style.display = 'flex'; return; }
            document.getElementById('depositModal').style.display = 'flex';
        };

        window.closeModal = (id) => document.getElementById(id).style.display = 'none';

        window.handleAuth = () => {
            if(!currentUser) document.getElementById('loginModal').style.display = 'flex';
            else switchTab('orders');
        };

        document.getElementById('googleLoginBtn').addEventListener('click', () => {
            signInWithPopup(auth, provider).then(() => closeModal('loginModal')).catch(err => alert("Lỗi đăng nhập: " + err.message));
        });

        document.getElementById('btnConfirmDeposit').addEventListener('click', async () => {
            if(!currentUser) { alert("Vui lòng đăng nhập!"); return; }
            
            const raw = document.getElementById('depositAmountInput').value.replace(/\./g, '');
            const amount = parseInt(raw) || 0;
            if(amount <= 0) { alert("Số tiền không hợp lệ!"); return; }

            const code = Math.floor(1000 + Math.random() * 9000).toString();
            const timeStr = new Date().toLocaleString('vi-VN');

            const newOrder = {
                id: code,
                uid: currentUser.uid,
                userName: currentUser.displayName || 'Khách',
                name: `Nạp tiền qua QR (${amount.toLocaleString('vi-VN')}đ)`,
                rawAmount: amount,
                price: amount.toLocaleString('vi-VN') + 'đ',
                date: timeStr,
                status: 'pending',
                type: 'deposit',
                timestamp: Date.now()
            };

            try {
                await addDoc(collection(db, "global_orders"), newOrder);

                await fetch(`https://api.telegram.org/bot${TOKEN}/sendMessage`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        chat_id: CHAT_ID,
                        text: `🔔 <b>CÓ YÊU CẦU NẠP TIỀN!</b>\n\n👤 Khách: ${currentUser.displayName}\n💰 Số tiền: ${amount.toLocaleString('vi-VN')}đ\n🔑 Mã CK: <code>${code}</code>\n⏰ Lúc: ${timeStr}\n\n👉 Gõ lệnh: <code>/duyet ${code}</code>`,
                        parse_mode: 'HTML'
                    })
                });

                alert(`Tạo yêu cầu thành công!\nTrạng thái: Đang duyệt\nMã chuyển khoản của bạn là: ${code}`);
                closeModal('depositModal');
                switchTab('orders');
            } catch(e) {
                alert("Lỗi kết nối: " + e.message);
            }
        });

        async function loadOrders() {
            if(!currentUser) {
                document.getElementById('orderContainer').innerHTML = `<div style="text-align:center; color: var(--text-sub); padding: 20px;">Vui lòng đăng nhập để xem đơn hàng</div>`;
                return;
            }
            try {
                const querySnapshot = await getDocs(collection(db, "global_orders"));
                let orders = [];
                let balance = 0;

                querySnapshot.forEach(docSnap => {
                    let d = docSnap.data();
                    if(d.uid === currentUser.uid) {
                        orders.push(d);
                        if(d.status === 'success' && d.type === 'deposit') balance += (d.rawAmount || 0);
                    }
                });

                document.getElementById('userBalance').innerText = balance.toLocaleString('vi-VN') + 'đ';
                orders.sort((a, b) => (b.timestamp || 0) - (a.timestamp || 0));

                const container = document.getElementById('orderContainer');
                if(orders.length === 0) {
                    container.innerHTML = `<div style="text-align:center; color: var(--text-sub); padding: 20px;">Chưa có giao dịch nào</div>`;
                    return;
                }

                container.innerHTML = orders.map(o => `
                    <div class="order-card">
                        <div class="order-header">
                            <span>${o.name}</span>
                            <span class="order-status ${o.status === 'pending' ? 'status-pending' : 'status-success'}">${o.status === 'pending' ? 'Đang duyệt' : 'Thành công'}</span>
                        </div>
                        <div style="font-size: 0.8rem; color: var(--text-sub);">Thời gian: ${o.date}</div>
                        <div style="margin-top: 6px; font-size: 0.85rem; font-weight: 600;">Mã nạp: [ ${o.id} ]</div>
                    </div>
                `).join('');
            } catch(e) {
                console.error(e);
            }
        }

        onAuthStateChanged(auth, (user) => {
            currentUser = user;
            if(user) {
                document.getElementById('authText').innerText = user.displayName.split(' ')[0];
                loadOrders();
            } else {
                document.getElementById('authText').innerText = 'Đăng nhập';
                document.getElementById('userBalance').innerText = '0đ';
            }
        });
    </script>
</body>
</html>
